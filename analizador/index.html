<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111315">
<meta name="robots" content="noindex">
<title>Analizador Djimenez</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#111315;--card:#1B1E21;--ink:#F3F1EC;--muted:#9AA0A6;--line:#2C3034;--or:#FF7A1F;--or2:rgba(255,122,31,.15);--ok:#4CC38A;--warn:#F2B33D;--bad:#F06A5A;--cy:#3DD6F5;--am:#FFE14D;--r:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Poppins,system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 60px}
h1{font:800 34px/1 "Barlow Condensed",sans-serif;margin:0;text-transform:uppercase}
h1 span{color:var(--or)}
.sub{color:var(--muted);font-size:13px;margin:6px 0 12px}
.steps{display:flex;gap:5px;margin:0 0 12px;position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}
.steps span{flex:1;text-align:center;font-size:11.5px;font-weight:600;padding:7px 2px;border-radius:99px;background:var(--card);color:var(--muted);border:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps span.on{background:var(--or);color:#fff;border-color:var(--or)}
.steps span.ok{color:var(--ok);border-color:rgba(76,195,138,.45)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:15px}
.seg{display:flex;background:#0C0D0F;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--muted);padding:9px 4px;border-radius:9px;font:600 14px Poppins,sans-serif;cursor:pointer}
.seg button.on{background:var(--or);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lbl{font-size:12px;color:var(--muted);margin:10px 0 5px}
.btn{border:0;border-radius:11px;padding:10px 14px;background:var(--or);color:#fff;font:600 14px Poppins,sans-serif;cursor:pointer}
.btn.sec{background:#2A2E33;color:var(--ink)}
.btn.sm{padding:8px 11px;font-size:13px}
.btn.big{width:100%;padding:16px;font-size:17px;border-radius:14px;margin-top:4px}
.btn:disabled{opacity:.4;cursor:default}
.drop{border:2px dashed var(--or);border-radius:var(--r);padding:26px 14px;text-align:center;cursor:pointer;display:block}
.drop b{display:block;font-size:17px;margin-bottom:3px;color:var(--or)}
.stage{position:relative;background:#000;border-radius:12px;overflow:hidden;touch-action:manipulation}
canvas#cv{display:block;width:auto;max-width:100%;max-height:80vh;height:auto;margin:0 auto}
.velo{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.45);color:#fff;font-size:13px;cursor:pointer}
.velo .btn{padding:18px 28px;font-size:19px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.stage.fs .velo{display:none}
.step{background:var(--or2);color:#FFD3B3;border-radius:10px;padding:9px 11px;font-size:13.5px;margin:10px 0}
.step b{color:#fff}
input[type=range]{width:100%;accent-color:var(--or)}
.t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;min-width:60px;text-align:right}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.kpi{background:#0F1113;border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi small{display:block;color:var(--muted);font-size:11.5px}
.kpi b{font:800 26px "Barlow Condensed",sans-serif}
.kpi b em{font-style:normal;font-size:14px;color:var(--muted);margin-left:3px}
.obs{border-left:3px solid var(--ok);background:#0F1113;border-radius:0 10px 10px 0;padding:9px 11px;margin-bottom:8px;font-size:13.5px}
.obs.warn{border-color:var(--warn)}.obs.bad{border-color:var(--bad)}
.obs b{display:block;margin-bottom:2px}
.note{font-size:12.5px;color:var(--muted)}
#iaNota{color:var(--cy);font-weight:600}
ul.tips{margin:6px 0 0;padding-left:18px;font-size:13.5px;color:#D6D3CD}
ul.tips li{margin-bottom:4px}
details summary{cursor:pointer;color:var(--ink);font-size:14px;font-weight:600}
.stage.fs{position:fixed;inset:0;z-index:40;border-radius:0;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;overflow-y:auto;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.stage.fs canvas#cv{width:auto!important;max-width:100%;max-height:calc(100vh - 310px);max-height:calc(100dvh - 310px);touch-action:none;flex:none;margin-top:8px}
.fsbar{display:none}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}.duo .btn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage:not(.fs) #fsx{display:none}
#fsok:disabled{opacity:.55}
.stage.fs .fsbar{display:flex;flex-direction:column;gap:8px;width:100%;max-width:760px;padding:10px 12px calc(24px + env(safe-area-inset-bottom));flex:none}
.pl{display:flex;gap:10px;background:#0F1113;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.pl>span{flex:none;width:26px;height:26px;border-radius:50%;background:var(--or);color:#fff;font-weight:700;display:grid;place-items:center;font-size:13px}
.pl b{display:block;font-size:14px}.pl p{margin:3px 0;font-size:12.5px;color:#C9C6C0}.pl small{color:var(--or);font-size:12.5px;font-weight:600}
.como .pl{margin-bottom:6px}.como .pl div{font-size:13.5px;color:#D6D3CD;align-self:center}
.navr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.navr h2{margin:0}
.navr .cnt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;background:#0F1113;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.slide .sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.slide .sh b{font-size:16px}
.slide .d{color:var(--or);font-size:12.5px;font-weight:600}
.slide canvas,.slide img{width:100%;display:block;border-radius:10px;background:#000}
.slide canvas.mc{touch-action:none;cursor:crosshair;width:auto;max-width:100%;max-height:62vh;margin:0 auto}
.slide p{margin:6px 0 0;font-size:13px;color:#C9C6C0}
.slide p.st{color:var(--cy);font-weight:600}
.slide p.done{color:var(--ok);font-weight:600}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:50%;background:#3A3F45}
.dots i.ok{background:var(--ok)}
.dots i.on{background:var(--or);transform:scale(1.25)}
.resp{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rb{border:1px solid #3A3F45;background:#15181B;color:var(--ink);border-radius:99px;padding:7px 12px;font:500 13px Poppins,sans-serif;cursor:pointer}
.rb.on{background:var(--or);border-color:var(--or);color:#fff}
.chip{font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 9px;background:#2A2E33;color:var(--muted);white-space:nowrap}
.chip.ok{background:rgba(76,195,138,.15);color:var(--ok)}.chip.warn{background:rgba(242,179,61,.15);color:var(--warn)}.chip.bad{background:rgba(240,106,90,.15);color:var(--bad)}
.ver{font-size:13px;margin-top:4px}
.sub3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 6px}
.ctl{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-top:8px}.ctl .btn{padding:10px 4px;white-space:nowrap}
.navr .row{flex-wrap:nowrap;flex:none}.navr h2{min-width:0}
#pv{display:block;width:auto;max-width:100%;max-height:52vh;max-height:52dvh;height:auto;margin:0 auto;border-radius:12px;background:#000;cursor:pointer}
.cargando{position:fixed;inset:0;z-index:60;background:rgba(17,19,21,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;font-size:17px;font-weight:600;text-align:center;padding:24px}
.spin{width:44px;height:44px;border:4px solid rgba(255,255,255,.2);border-top-color:var(--or);border-radius:50%;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.iachip{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:4;background:rgba(0,0,0,.72);color:var(--cy);font-size:13px;font-weight:600;padding:7px 12px;border-radius:99px;display:flex;align-items:center;gap:8px;pointer-events:none;white-space:nowrap}
.iachip .spin{width:16px;height:16px;border-width:2px;border-top-color:var(--cy)}
.modal{position:fixed;inset:0;z-index:70;background:rgba(10,11,12,.86);display:flex;align-items:center;justify-content:center;padding:18px}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:420px;width:100%;text-align:center}
.modal h3{font:800 28px/1.05 "Barlow Condensed",sans-serif;text-transform:uppercase;margin:6px 0 8px}
.modal ul{text-align:left;font-size:14px;color:#D6D3CD;padding-left:20px;margin:10px 0 14px}
.precio{font:800 40px "Barlow Condensed",sans-serif;color:var(--or)}.precio small{font-size:16px;color:var(--muted)}
.cuenta input{width:100%;background:#0F1113;border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:12px;font:500 16px Poppins,sans-serif;margin:8px 0}
.cuenta .barra{height:8px;background:#0F1113;border-radius:99px;overflow:hidden;margin:8px 0}.cuenta .barra i{display:block;height:100%;background:var(--or)}
.cuenta .msg{font-size:13px;margin-top:6px;color:var(--warn)}
.cuenta .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px}
.lnk{background:none;border:0;color:var(--muted);text-decoration:underline;font:500 12.5px Poppins,sans-serif;cursor:pointer;padding:4px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;background:var(--ok);color:#06140c;font-weight:700;padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.trio .btn{padding:12px 6px;font-size:13.5px;min-height:52px}
.qrbox{background:#fff;border-radius:16px;padding:10px;width:min(300px,72vw);margin:12px auto}.qrbox svg{display:block;width:100%;height:auto}
canvas,.stage,.nosel{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
.opcs-pago{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px;align-items:stretch}.opc-pago{display:flex;flex-direction:column;justify-content:space-between;gap:6px;padding:12px;border:1px solid var(--line);border-radius:14px;text-align:center}.opc-pago.dest{border-color:var(--or)}.opc-pago .precio{margin:2px 0;font-size:30px;line-height:1.1}.opc-pago .precio small{display:block;font-size:13px;margin-top:4px;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <h1><span data-t="h1a"></span> <span>Djimenez</span></h1>
  <p class="sub" data-t="sub"></p>
  <div class="steps" id="steps"><span class="on" data-t="st1"></span><span data-t="st2"></span><span data-t="st3"></span></div>

  <!-- 1 · inicio -->
  <div id="inicio">
    <div class="card como"><h2 data-t="comoT"></h2>
      <div class="pl"><span>1</span><div data-t="paso1"></div></div>
      <div class="pl"><span>2</span><div data-t="paso2"></div></div>
      <div class="pl"><span>3</span><div data-t="paso3"></div></div>
    </div>
    <div class="card">
      <div class="lbl" style="margin-top:0" data-t="liftT"></div>
      <div class="seg" id="lift"><button data-l="snatch" class="on">Snatch</button><button data-l="clean">Clean</button><button data-l="jerk">Jerk</button></div>
      <div class="lbl" data-t="lado"></div>
      <div class="seg" id="face"><button data-f="-1" data-t="izq"></button><button data-f="1" class="on" data-t="der"></button></div>
    </div>
    <div class="card cuenta hidden" id="cuenta"></div>
    <label class="drop card" id="drop"><input type="file" id="file" accept="video/*" hidden><b data-t="subir"></b><span class="note" data-t="subirN"></span></label>
    <div class="card"><details><summary data-t="tipsT"></summary><ul class="tips"><li data-t="tip1"></li><li data-t="tip2"></li><li data-t="tip3"></li><li data-t="tip4"></li><li data-t="tip5"></li></ul></details></div>
    <div class="card"><details><summary data-t="vsT"></summary><ul class="tips"><li data-t="vs1"></li><li data-t="vs2"></li><li data-t="vs3"></li><li data-t="vs4"></li></ul><p class="note" data-t="vsN"></p></details></div>
  </div>

  <!-- 2a · seguir el disco -->
  <div id="work" class="hidden">
    <div class="card">
      <div class="stage" id="stage"><div class="velo" id="velo"><button class="btn" id="empezar" data-t="empezar"></button><span data-t="empezarN"></span></div><div class="iachip hidden" id="iachip"><span class="spin"></span><span id="iachipT"></span></div><button class="btn sec" id="fsx" style="position:absolute;top:10px;right:10px;z-index:2">✕</button><canvas id="cv"></canvas><div class="fsbar"><p class="step" id="fsstep" style="margin:0"></p><div class="row"><button class="btn sec" id="fsprev">◀︎ 1</button><input type="range" id="fscrub" min="0" max="1000" value="0" style="flex:1"><button class="btn sec" id="fsnext">1 ▶︎</button><span class="t" id="fstl"></span></div><div class="duo"><button class="btn sec" id="fsundo" data-t="deshacer"></button><button class="btn sec" id="fsauto" data-t="detectar"></button></div><button class="btn" id="fsok" style="width:100%;padding:14px;font-size:16px" data-t="hecho"></button></div></div>
      <div class="step" id="step"></div>
      <div class="row"><button class="btn sec" id="prev">◀︎ 1</button><input type="range" id="scrub" min="0" max="1000" value="0" style="flex:1"><button class="btn sec" id="next">1 ▶︎</button><span class="t" id="tlabel"></span></div>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="go" disabled data-t="seguir"></button>
        <button class="btn sec" id="stop" disabled data-t="parar"></button>
        <button class="btn sec" id="undo" data-t="deshacer"></button>
        <button class="btn sec" id="redo" data-t="redo"></button>
      </div>
    </div>
  </div>

  <!-- 2b · análisis: barra y posición juntas -->
  <div id="pAnal" class="hidden">
    <div class="card nosel"><h2 id="resT" style="margin-bottom:6px"></h2><canvas id="pv"></canvas><p class="note" id="iaNota" style="margin:6px 0 0"></p>
      <div class="ctl"><button class="btn" id="rpgo"></button><button class="btn sec" id="rpini" data-t="otra"></button><button class="btn sec" id="rploop"></button><button class="btn sec" id="rpvel"></button></div></div>
    <div class="card" id="elegir"><h2 data-t="elT"></h2><div class="duo"><button class="btn" id="elPaso" data-t="elPaso"></button><button class="btn sec" id="elConc" data-t="elConc"></button></div></div>
    <div id="detalle" class="hidden">
    <div class="card"><h2 data-t="barraT"></h2><div id="planB"></div></div>
    <div class="card" id="cardEsc">
      <div class="navr"><h2 data-t="escT"></h2><div class="row"><span class="cnt" id="escCnt"></span><button class="btn sec sm" id="escPrev">◀︎</button><button class="btn sec sm" id="escNext">▶︎</button></div></div>
      <p class="note" style="margin:0 0 8px" id="escN"></p>
      <div class="track" id="escTrack"></div>
      <div class="dots" id="escDots"></div>
    </div>
    <div class="card"><details><summary data-t="datosT"></summary><div class="kpis" id="kpis"></div><div id="obs" style="margin-top:10px"></div><p class="note" data-t="orient"></p><button class="btn sec" id="dl" style="width:100%;margin-top:6px" data-t="dl"></button><p class="note" id="dlnota" style="margin:6px 0 0"></p></details></div>
    <button class="btn big" id="sigConc" data-t="sigConc" style="margin-bottom:12px"></button>
    </div>
    <div class="card"><h2 data-t="compT"></h2><p class="note" style="margin:0 0 10px" data-t="compN"></p><div class="trio"><button class="btn" id="compVid" data-t="compVid"></button><button class="btn sec" id="compWa" data-t="compWa"></button><button class="btn sec" id="compQr" data-t="compQr"></button></div><p class="note" id="compNota" style="margin:8px 0 0"></p></div>
    <button class="btn sec" id="corregir" style="width:100%" data-t="corregir"></button>
  </div>

  <!-- 3 · conclusiones -->
  <div id="pConc" class="hidden">
    <div class="card" id="cardConc">
      <div class="navr"><h2 data-t="conT"></h2><div class="row"><span class="cnt" id="conCnt"></span><button class="btn sec sm" id="conPrev">◀︎</button><button class="btn sec sm" id="conNext">▶︎</button></div></div>
      <div class="track" id="conTrack"></div>
      <div class="dots" id="conDots"></div>
    </div>
    <div class="card"><div class="row"><button class="btn sec" id="copy" data-t="copy"></button><span class="note" id="copied"></span></div></div>
    <div class="card"><h2 data-t="appT"></h2><div class="trio" style="grid-template-columns:repeat(2,1fr)"><button class="btn sec" id="appWa" data-t="compWa"></button><button class="btn sec" id="appQr" data-t="compQr"></button></div></div>
    <div class="card" id="otroCard"><h2 data-t="otroT"></h2><div class="trio" id="otroLifts" style="grid-template-columns:repeat(2,1fr)"></div><button class="btn sec" id="otro" style="width:100%;margin-top:8px" data-t="otro"></button></div>
    <button class="btn sec" id="volverP" style="width:100%;margin-top:8px" data-t="volverP"></button>
  </div>
</div>

/* ---------- IA de postura (MediaPipe, en el propio móvil) ---------- */
const MP="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.3";
const MODELO="https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task";
let PL=null,PLp=null;
function cargarIA(){
  if(PLp)return PLp;
  PLp=(async()=>{
    const v=await import(MP+"/vision_bundle.mjs");
    const fs=await v.FilesetResolver.forVisionTasks(MP+"/wasm");
    const mk=d=>v.PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:MODELO,delegate:d},runningMode:"IMAGE",numPoses:1});
    try{PL=await mk("GPU")}catch(e){PL=await mk("CPU")}
    return PL;
  })().catch(e=>{console.warn("IA",e);PLp=null;return null});
  return PLp;
}
// puntos del lado que da a la cámara: hombro, codo, muñeca, cadera, rodilla, tobillo, talón, punta del pie
const LAD={L:[11,13,15,23,25,27,29,31],R:[12,14,16,24,26,28,30,32]};
S.pv=new Map(); // posturas ya detectadas, por tiempo (ms)
function poseAhora(){if(!PL||S.tAct==null)return null;const k=Math.round(S.tAct*1000);if(!S.pv.has(k))S.pv.set(k,detectar());return S.pv.get(k)}
function ladoDe(lm){const s=a=>a.reduce((x,k)=>x+(lm[k].visibility||0),0);return s([11,23,25,27])>=s([12,24,26,28])?"L":"R"}
function pintaPoseVivo(){if(S.grabando||!S.running)return;poseAhora()} // durante el seguimiento la IA va mirando tu cuerpo sin dibujarlo: se ve después, en la pantalla partida
function detectar(){try{const r=PL&&PL.detect(FC);return r&&r.landmarks&&r.landmarks[0]||null}catch(e){return null}}
function aCV(lm,lado){return LAD[lado].map(k=>({x:lm[k].x*CV.width,y:lm[k].y*CV.height,v:lm[k].visibility||0}))}
async function posturas(prog){
  S.pose=null;S.lado=null;
  const pl=await cargarIA();if(!pl)return false;
  const N=S.pts.length,need=new Set();for(let i=0;i<N;i+=2)need.add(i);need.add(N-1);S.R.claves.forEach(c=>need.add(c[0]));
  const idx=[...need].sort((a,b)=>a-b),raw=[];let vl=0,vr=0;
  for(let j=0;j<idx.length;j++){
    const i=idx[j],k=Math.round(S.pts[i].t*1000);let lm;
    if(S.pv.has(k))lm=S.pv.get(k);else{await seek(S.pts[i].t);lm=poseAhora()}
    if(lm){raw.push({i,t:S.pts[i].t,lm});vl+=[11,23,25,27].reduce((s,k)=>s+(lm[k].visibility||0),0);vr+=[12,24,26,28].reduce((s,k)=>s+(lm[k].visibility||0),0)}
    prog&&prog((j+1)/idx.length);
  }
  if(raw.length<3)return false;
  S.lado=vl>=vr?"L":"R";
  const crudo=raw.map(r=>({i:r.i,t:r.t,p:brazos(aCV(r.lm,S.lado),r.t)}));
  // suavizado en el tiempo: cada punto es la media de sus vecinos (más peso a los cercanos y a los que la IA ve bien)
  S.pose=crudo.map(q=>({i:q.i,t:q.t,p:q.p.map((_,k)=>{let sx=0,sy=0,sw=0;
    for(const o of crudo){const d=(o.t-q.t)/(k===1?0.16:k===2?0.11:0.07);if(Math.abs(d)>2.5)continue;
      // el codo: mismo peso lo vea la IA o se calcule, para que no salte de uno a otro
      const w=Math.exp(-d*d/2)*(k===1?1:(0.3+(o.p[k].v||0)));sx+=o.p[k].x*w;sy+=o.p[k].y*w;sw+=w}
    return {x:sx/sw,y:sy/sw,v:q.p[k].v}})}));
  estabCodos();
  return true;
}
/* codo estable: se suaviza en el tiempo y queda a la largura del brazo desde el hombro (no salta, no se estira).
   Se usa al analizar y cada vez que arrastras un punto; el codo que pones tú a mano se respeta */
function estabCodos(){
  if(!S.pose||!S.pose.length)return;
  const A=S.pose,base=A.map(f=>({x:f.p[1].x,y:f.p[1].y,u:f.p[1].u}));
  A.forEach((f,i)=>{const P=f.p,S0=P[0],c=P[3],torso=Math.hypot(S0.x-c.x,S0.y-c.y)||1,L1=0.62*torso;
    let E=base[i];
    if(!E.u){let sx=0,sy=0,sw=0;A.forEach((o,j)=>{const d=(o.t-f.t)/0.16;if(Math.abs(d)>2.5)return;
      // cada codo vecino, visto desde su propio hombro y llevado a este hombro (así el tronco no arrastra el codo)
      const w=Math.exp(-d*d/2);sx+=(base[j].x-o.p[0].x+S0.x)*w;sy+=(base[j].y-o.p[0].y+S0.y)*w;sw+=w});
      E={x:sx/sw,y:sy/sw}}
    const dx=E.x-S0.x,dy=E.y-S0.y,d=Math.hypot(dx,dy)||1;
    P[1]={...P[1],x:S0.x+dx/d*L1,y:S0.y+dy/d*L1}});
}
// solo vale una postura de un fotograma cercano: si la IA no vio el cuerpo en ese momento, no se inventa
function poseEn(tt){if(!S.pose||!S.pose.length)return null;const A=S.pose;let j=0;while(j<A.length-1&&A[j+1].t<=tt)j++;
  const a=A[j],b=A[Math.min(j+1,A.length-1)];if(Math.min(Math.abs(a.t-tt),Math.abs(b.t-tt))>0.12)return null;
  if(b===a||b.t-a.t>0.3||tt<=a.t)return a; // entre dos detecciones, el cuerpo se mueve poco a poco (sin saltos)
  const f=Math.min(1,(tt-a.t)/(b.t-a.t));return {i:a.i,t:tt,p:a.p.map((q,k)=>({x:q.x+(b.p[k].x-q.x)*f,y:q.y+(b.p[k].y-q.y)*f,v:q.v}))}}
function poseIdx(i){if(!S.pose)return null;let b=S.pose[0];for(const q of S.pose)if(Math.abs(q.i-i)<Math.abs(b.i-i))b=q;return Math.abs(b.i-i)<=3?b:null}
/* brazos: si la IA no ve bien un brazo, se reconstruye con lógica (las manos van en la barra) */
function barEn(tt){if(!S.pts.length)return null;let b=S.pts[0];for(const p of S.pts)if(Math.abs(p.t-tt)<Math.abs(b.t-tt))b=p;return b}
function brazos(p,tt){
  const b=barEn(tt);if(!b)return p;
  const P=p.map(q=>({...q})),S0=P[0],c=P[3],torso=Math.hypot(S0.x-c.x,S0.y-c.y)||1;
  const L1=0.62*torso,L2=0.55*torso,f=S.face; // brazo y antebrazo, proporcionales al tronco
  const w=P[2],e=P[1],lejos=Math.hypot(w.x-b.x,w.y-b.y)>0.45*torso;
  if(!w.u&&((w.v||0)<0.5||lejos))P[2]={x:b.x,y:b.y,v:0}; // la mano, en la barra (salvo si la has puesto tú)
  const W=P[2],dx=W.x-S0.x,dy=W.y-S0.y,d=Math.hypot(dx,dy)||1;
  // barra apoyada en los hombros (recepción del clean, salida del jerk): codos altos y hacia delante
  // (en clean y jerk; en el snatch la barra no se apoya en los hombros)
  const sn=S.lift==="snatch",paso=(v,a,b)=>Math.max(0,Math.min(1,(v-a)/(b-a)));
  // brazo doblado: el codo cae donde encajan brazo y antebrazo. Se da por estirado un poco antes de llegar
  // a la longitud total, y sin saltos: cuanto más lejos está la barra, más se abre el codo
  const dd=Math.min(L1+L2,d/0.9),a=(L1*L1-L2*L2+dd*dd)/(2*dd),h=Math.sqrt(Math.max(0,L1*L1-a*a)),ux=dx/d,uy=dy/d;
  const E1={x:S0.x+ux*a-uy*h,y:S0.y+uy*a+ux*h},E2={x:S0.x+ux*a+uy*h,y:S0.y+uy*a-ux*h};
  // en el tirón del clean (barra por debajo del hombro) y en el giro del snatch, el codo va atrás y arriba; en el jerk, delante
  const atras=sn||(S.lift==="clean"&&dy>0),pt=q=>(atras?-1:1)*(f*(q.x-S0.x)+0.25*(q.y-S0.y));
  let E=pt(E1)>=pt(E2)?E1:E2;
  // barra apoyada en los hombros (recepción del clean, salida del jerk): codos altos y hacia delante.
  // Se mezcla poco a poco con el codo calculado para que no salte al entrar o salir de esa posición (en el snatch no hay)
  const wr=sn?0:(1-paso(d,0.7*L1,1.05*L1))*paso(dy,-0.95*L1,-0.6*L1)*(1-paso(dy,0.25*L1,0.45*L1)),rack=wr>0.5;
  if(wr>0)E={x:E.x+(S0.x+f*0.9*L1-E.x)*wr,y:E.y+(S0.y+0.18*L1-E.y)*wr};
  // el codo que ve la IA solo se queda si encaja con un brazo de verdad y no se aleja de donde tiene que estar
  // (si unas veces vale el de la IA y otras el calculado, el codo da saltos)
  const ok=e.u||(e.v||0)>=0.5&&!lejos&&Math.abs(Math.hypot(e.x-S0.x,e.y-S0.y)-L1)<0.35*L1&&Math.abs(Math.hypot(e.x-W.x,e.y-W.y)-L2)<0.4*L2
    &&Math.hypot(e.x-E.x,e.y-E.y)<0.45*L1&&(!rack||(f*(e.x-S0.x)>0.3*L1&&e.y<S0.y+0.6*L1));
  if(!ok)P[1]={x:E.x,y:E.y,v:0};
  return P;
}
/* esqueleto con ángulos de rodilla y cadera */
function esqueleto(c,p,k){
  const P=p.map(q=>[q.x*k,q.y*k]),lw=Math.max(2,3.5*k);
  c.save();c.lineCap="round";c.lineJoin="round";c.strokeStyle=CY;c.lineWidth=lw;c.shadowColor=CY;c.shadowBlur=lw*2;
  c.beginPath();[[0,1],[1,2],[0,3],[3,4],[4,5],[5,6],[6,7],[5,7]].forEach(([a,b])=>{c.moveTo(P[a][0],P[a][1]);c.lineTo(P[b][0],P[b][1])});c.stroke();c.shadowBlur=0;
  P.forEach(q=>{c.fillStyle="#fff";c.beginPath();c.arc(q[0],q[1],lw*1.1,0,7);c.fill()});
  const A=(a,b,d)=>ang({x:P[a][0],y:P[a][1]},{x:P[b][0],y:P[b][1]},{x:P[d][0],y:P[d][1]});
  c.font=`700 ${Math.round(14*k)}px Poppins,sans-serif`;c.lineWidth=3*k;c.strokeStyle="rgba(0,0,0,.85)";c.fillStyle="#fff";
  [[A(3,4,5)+"°",P[4]],[A(0,3,4)+"°",P[3]]].forEach(([tx,q])=>{const x0=S.face>0?q[0]-9*k-c.measureText(tx).width:q[0]+9*k;c.strokeText(tx,x0,q[1]);c.fillText(tx,x0,q[1])});
  c.restore();
}

/* ---------- disco automático: busca el círculo del disco en el fotograma ---------- */
function autoDisco(cerca){ // cerca: punto que ha tocado el usuario (busca el disco solo ahí)
  if(!FC.width)return false;
  const sw=160,sc=FC.width/sw,sh=Math.round(FC.height/sc),N=sw*sh;
  const cc=document.createElement("canvas");cc.width=sw;cc.height=sh;const cx2=cc.getContext("2d",{willReadFrequently:true});cc.getContext("2d").drawImage(FC,0,0,sw,sh);
  const d=cx2.getImageData(0,0,sw,sh).data;
  // bordes por color (R, G y B por separado): un disco rojo sobre fondo oscuro también se ve
  const ch=[0,1,2].map(c=>{const g=new Float32Array(N),b=new Float32Array(N);for(let i=0;i<N;i++)g[i]=d[i*4+c];
    for(let y=1;y<sh-1;y++)for(let x=1;x<sw-1;x++){let q=0;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)q+=g[(y+j)*sw+x+i];b[y*sw+x]=q/9}return b});
  const gx=new Float32Array(N),gy=new Float32Array(N),mg=new Float32Array(N);let su=0,sq=0,cn=0;
  for(let y=2;y<sh-2;y++)for(let x=2;x<sw-2;x++){const k=y*sw+x;let bx=0,by=0,bm=0;
    for(const b of ch){const vx=(b[k-sw+1]+2*b[k+1]+b[k+sw+1])-(b[k-sw-1]+2*b[k-1]+b[k+sw-1]);
      const vy=(b[k+sw-1]+2*b[k+sw]+b[k+sw+1])-(b[k-sw-1]+2*b[k-sw]+b[k-sw+1]);const m=Math.hypot(vx,vy);if(m>bm){bm=m;bx=vx;by=vy}}
    gx[k]=bx;gy[k]=by;mg[k]=bm;su+=bm;sq+=bm*bm;cn++}
  const mu=su/cn,sd=Math.sqrt(Math.max(0,sq/cn-mu*mu)),th=Math.max(18,mu+1.2*sd);
  const r0=Math.max(5,Math.round(0.04*Math.max(sw,sh))),r1=Math.max(r0+2,Math.round(0.24*Math.min(sw,sh))),nr=r1-r0+1;
  const acc=new Float32Array(N*nr);
  for(let y=2;y<sh-2;y++)for(let x=2;x<sw-2;x++){const k=y*sw+x,m=mg[k];if(m<th)continue;const ux=gx[k]/m,uy=gy[k]/m;
    for(let ri=0;ri<nr;ri++){const r=r0+ri;for(let sg=-1;sg<=1;sg+=2){const X1=Math.round(x+sg*ux*r),Y1=Math.round(y+sg*uy*r);if(X1>=0&&Y1>=0&&X1<sw&&Y1<sh)acc[ri*N+Y1*sw+X1]++}}}
  const pun=(ri,x,y)=>{let q=0;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const X1=x+i,Y1=y+j;if(X1>=0&&Y1>=0&&X1<sw&&Y1<sh)q+=acc[ri*N+Y1*sw+X1]}return q/(2*Math.PI*(r0+ri))};
  // si la IA ya ve el cuerpo, el disco suele estar a la altura de las espinillas (snatch y clean)
  // o de los hombros (jerk: la barra empieza apoyada en los hombros)
  const jk=S.lift==="jerk";let pr=null;const lm=PL&&!cerca?poseAhora():null;
  const ct=cerca?{x:cerca.x/sc,y:cerca.y/sc}:null;
  if(lm&&jk)pr={x:(lm[11].x+lm[12].x)/2*sw,y:(lm[11].y+lm[12].y)/2*sh};
  else if(lm){const ax=(lm[27].x+lm[28].x)/2*sw,ay=(lm[27].y+lm[28].y)/2*sh,ky=(lm[25].y+lm[26].y)/2*sh;pr={x:ax,y:(ay+ky)/2}}
  let best=null;
  for(let ri=0;ri<nr;ri++){const r=r0+ri;
    for(let y=Math.max(r,cerca||jk?0:Math.round(sh*.3));y<=Math.min(sh-1,sh-r+2);y++)for(let x=0;x<sw;x++){
      if(ct&&Math.hypot(x-ct.x,y-ct.y)>Math.max(3,0.3*r))continue;
      if(acc[ri*N+y*sw+x]<0.2*r)continue;
      const sv=pun(ri,x,y);if(sv<0.18)continue;
      let v=sv*r; // cuenta el total de borde que apoya el círculo: un disco grande pesa más que un círculo pequeño cualquiera
      if(pr)v*=Math.exp(-(((x-pr.x)/(0.22*sw))**2)-(((y-pr.y)/(0.3*sh))**2));
      else if(jk&&!ct)v*=y<0.5*sh?1.6:1; // jerk sin IA todavía: el disco está en la mitad de arriba
      if(!best||v>best.v)best={v,s:sv,ri,x,y}}}
  if(!best||best.s<0.2)return false;
  // si hay círculos concéntricos (el centro del disco), quedarse con el borde exterior
  const prof=[];for(let ri=0;ri<nr;ri++){let m=0,mx=best.x,my=best.y;
    for(let j=-3;j<=3;j++)for(let i=-3;i<=3;i++){const X1=best.x+i,Y1=best.y+j;if(X1<0||Y1<0||X1>=sw||Y1>=sh)continue;const v=pun(ri,X1,Y1);if(v>m){m=v;mx=X1;my=Y1}}prof.push({m,x:mx,y:my})}
  let valle=Infinity,cand=null;const rb=r0+best.ri;
  for(let ri=best.ri+1;ri<nr;ri++){const p=prof[ri];valle=Math.min(valle,p.m);
    const pico=p.m>=(prof[ri-1]?.m||0)&&p.m>=(prof[ri+1]?.m||0);
    if(r0+ri>=1.6*rb&&pico&&p.m>=Math.max(0.18,0.2*best.s)&&p.m>=1.8*valle&&p.y+r0+ri<=sh+2&&(!cand||p.m>cand.m))cand={...p,ri}}
  if(cand){let ri=cand.ri;while(ri+1<nr&&prof[ri+1].m>=0.85*cand.m&&prof[ri+1].y+r0+ri+1<=sh+2)ri++; // el borde de fuera, no un aro de dentro
    best={...best,ri,x:prof[ri].x,y:prof[ri].y}}
  const cx=(best.x+.5)*sc,cy=(best.y+.5)*sc,r=(r0+best.ri)*sc;
  S.cal=[{x:cx,y:cy-r},{x:cx,y:cy+r}];S.pxcm=2*r/DISCO;
  base();S.pts=[{x:cx,y:cy,t:V.currentTime}];S.tpl=plantilla(cx,cy);
  S.mode="listo";S.R=null;S.auto=true;S.centroAuto=true;
  return true;
}

/* ---------- trayectoria suave y brillante ---------- */
function liso(a){return a.map((p,i)=>{const q=a.slice(Math.max(0,i-2),i+3);return {t:p.t,x:q.reduce((s,z)=>s+z.x,0)/q.length,y:q.reduce((s,z)=>s+z.y,0)/q.length}})}
function trazo(c,pts,map,w,col,glow){
  if(pts.length<2)return;const P=pts.map(map);
  c.save();c.lineJoin="round";c.lineCap="round";c.lineWidth=w;c.strokeStyle=col;
  if(glow){c.shadowColor=col;c.shadowBlur=w*2.5}
  c.beginPath();c.moveTo(P[0][0],P[0][1]);
  for(let i=1;i<P.length-1;i++){const mx=(P[i][0]+P[i+1][0])/2,my=(P[i][1]+P[i+1][1])/2;c.quadraticCurveTo(P[i][0],P[i][1],mx,my)}
  const L=P[P.length-1];c.lineTo(L[0],L[1]);c.stroke();c.restore();

/* posición del dedo dentro de un canvas */

const soltar=()=>{if(S.arr==null)return;const a=S.arr;S.arr=null;S.lupa=null;
  if(a.cal&&S.cal.length===2){const d=Math.hypot(S.cal[0].x-S.cal[1].x,S.cal[0].y-S.cal[1].y);if(d>=8)S.pxcm=d/DISCO}

/* ---------- seguimiento por plantilla ---------- */
function gris(x0,y0,w,h){
  x0=Math.max(0,Math.round(x0));y0=Math.max(0,Math.round(y0));w=Math.min(CV.width-x0,Math.round(w));h=Math.min(CV.height-y0,Math.round(h));
  const d=X.getImageData(x0,y0,w,h).data,g=new Float32Array(w*h);
  for(let i=0;i<w*h;i++)g[i]=d[i*4]*.299+d[i*4+1]*.587+d[i*4+2]*.114;
  return {g,w,h,x0,y0};
}
function lado(){return Math.max(18,Math.min(70,Math.round((S.pxcm||2)*DISCO*0.45)))}
function plantilla(x,y){const s=lado();return gris(x-s/2,y-s/2,s,s)}
function buscar(px,py){
  const T=S.tpl, s=T.w, R=Math.round(s*1.3);

$("#go").onclick=async()=>{
  if(!S.pts.length)return;
  if(S.pts[S.pts.length-1].t>=V.duration-2*S.dt){aviso(t("Estás al final del vídeo. Vuelve al principio con la barra de abajo, toca el centro del disco ahí y dale otra vez.","Tu es à la fin de la vidéo. Reviens au début avec le curseur, touche le centre du disque et relance.","You're at the end of the video. Go back to the start with the slider, tap the centre of the plate there and try again."));return}

    const a=S.pts[S.pts.length-1], b=S.pts[S.pts.length-2]||a;

    if(!S.running)break;
    frame();
    const p=buscar(a.x+(a.x-b.x)*.7,a.y+(a.y-b.y)*.7);
    S.pts.push({x:p.x,y:p.y,t:a.t+S.dt});
    S.tpl=plantilla(p.x,p.y);

    await new Promise(r=>setTimeout(r,0));

};

/* marca de agua del vídeo: el símbolo de Djimenez Apps (círculo azul con <✦>) + levantamiento + web */
function marca(o,H,k){
  const R=27*k,cx=16*k+R,cy=H-16*k-R,x0=cx+R+12*k;
  o.save();o.shadowColor="rgba(0,0,0,.55)";o.shadowBlur=10*k;o.fillStyle="#2f5fae";o.beginPath();o.arc(cx,cy,R,0,7);o.fill();o.shadowBlur=0;
  const fs=Math.round(R*.78),pz=[["<","#fff"],["✦","#f2a33a"],[">","#fff"]];o.font=`700 ${fs}px Arial,sans-serif`;o.textBaseline="middle";
  const ws=pz.map(p=>o.measureText(p[0]).width),tot=ws.reduce((a,b)=>a+b,0)+2*k;let x=cx-tot/2;
  pz.forEach((p,i)=>{o.fillStyle=p[1];o.fillText(p[0],x,cy+fs*.04);x+=ws[i]+k});
  o.textBaseline="alphabetic";o.shadowColor="rgba(0,0,0,.7)";o.shadowBlur=8*k;
  o.font=`italic 800 ${Math.round(28*k)}px Poppins,sans-serif`;o.fillStyle="#fff";o.fillText((S.nom||"").toUpperCase(),x0,cy+2*k);
  o.font=`700 ${Math.round(15*k)}px Poppins,sans-serif`;o.fillStyle="rgba(255,255,255,.88)";o.fillText("djimenezapps.com",x0,cy+R-2*k);o.restore();
}
async function exportar(){
  const tipos=["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9","video/webm"];
  const tipo=window.MediaRecorder&&tipos.find(x=>MediaRecorder.isTypeSupported(x));
  if(!tipo)throw new Error("sin MediaRecorder");
  const sc=Math.min(1,1080/Math.max(V.videoWidth,V.videoHeight));
  const W=Math.round(V.videoWidth*sc/2)*2,H=Math.round(V.videoHeight*sc/2)*2,k=W/CV.width;
  const oc=document.createElement("canvas");oc.width=S.pose?2*W:W;oc.height=H;const o=oc.getContext("2d");
  const pinta=tt=>{
    pintaDoble(o,W,H,k,tt);
    marca(o,H,k);
  };
  const t1=Math.min(V.duration-0.05,S.pts[S.pts.length-1].t+0.6);
  const fps=30,t0=Math.max(0,S.pts[0].t-0.4),N=Math.max(1,Math.ceil((t1-t0)*fps));
  await seek(t0);
  const rec=new MediaRecorder(oc.captureStream(fps),{mimeType:tipo,videoBitsPerSecond:8e6});
  const trozos=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)trozos.push(e.data)};
  const parado=new Promise(r=>rec.onstop=r);
  pinta(t0);rec.start(250);
  const inicio=performance.now(),PREP=t("Preparando el vídeo…","Préparation de la vidéo…","Preparing the video…");
  for(let i=1;i<=N;i++){
    const tt=t0+i/fps;await seek(tt);pinta(tt);
    $("#dlnota").textContent=`${PREP} ${Math.round(i/N*100)} %`;
    const espera=inicio+i*1000/fps-performance.now();if(espera>0)await new Promise(r=>setTimeout(r,espera));
  }
  await new Promise(r=>setTimeout(r,300));rec.stop();await parado;
  const ext=tipo.includes("mp4")?"mp4":"webm",nombre=`${(S.nom||"lift").toLowerCase()}-${t("analisis","analyse","analysis")}-djimenez.${ext}`;
  return new File(trozos,nombre,{type:tipo.split(";")[0]});
}

const ERR={email:t("Ese email no parece válido.","Cet e-mail ne semble pas valide.","That email doesn't look valid."),codigo:t("El código no es correcto.","Le code n'est pas correct.","That code isn't right."),caducado:t("El código ha caducado. Pide otro.","Le code a expiré. Demandes-en un autre.","The code has expired. Ask for a new one."),muchos:t("Demasiados códigos. Espera un rato.","Trop de codes. Attends un peu.","Too many codes. Wait a little."),sin_email:t("El acceso por email se está activando. Vuelve a probar en unos minutos.","La connexion par e-mail est en cours d'activation. Réessaie dans quelques minutes.","Email sign-in is being switched on. Try again in a few minutes."),red:t("Sin conexión. Vuelve a probar.","Pas de connexion. Réessaie.","No connection. Try again.")};
function urlPago(base=PAGO){return base+"?prefilled_email="+encodeURIComponent(C.st.email)+"&client_reference_id="+encodeURIComponent(C.st.id)+"&locale="+LANG}
function pintaCuenta(){
  const el=$("#cuenta"),st=C.st;
  if(st){
    const pct=Math.min(100,st.usados/st.limite*100),quedan=Math.max(0,st.limite-st.usados);
    el.innerHTML=`<div class="top"><span>📧 ${st.email}</span><button class="lnk" id="salir">${t("Salir","Déconnexion","Sign out")}</button></div>`+
      (st.pro?`<p style="margin:8px 0 0;font-weight:700;color:var(--ok)">⭐ ${t("Plan ilimitado activo","Formule illimitée active","Unlimited plan active")}</p>`:
      `<div class="barra"><i style="width:${pct}%"></i></div><div class="top"><span><b>${quedan}</b> ${st.limite>3?t("análisis disponibles","analyses disponibles","analyses left"):t("análisis de prueba gratis","analyses d'essai gratuites","free trial analyses left")} (${st.usados}/${st.limite})</span></div>
       <button class="btn sec" id="hazPro" style="width:100%;margin-top:10px">⭐ ${t("Más análisis: 10 por 4,99 € o ilimitado","Plus d'analyses : 10 pour 4,99 € ou illimité","More analyses: 10 for €4.99 or unlimited")}</button>`);
    $("#salir").onclick=async()=>{await api("salir");C.token=null;C.st=null;LS.set("an_token",null);C.paso="email";pintaCuenta()};
    if($("#hazPro"))$("#hazPro").onclick=()=>muro(false);
    return;
  }
  el.innerHTML=`<h2 style="margin-bottom:4px">🔓 ${t("Entra para analizar","Connecte-toi pour analyser","Sign in to analyze")}</h2>
    <p class="note" style="margin:0">${t("3 análisis de prueba gratis. Te mandamos un código a tu email, sin contraseña.","3 analyses d'essai gratuites. On t'envoie un code par e-mail, sans mot de passe.","3 free trial analyses. We email you a code, no password.")}</p>`+
    (C.paso==="email"?`<input id="cEmail" type="email" inputmode="email" autocomplete="email" placeholder="${t("tu@email.com","ton@email.com","you@email.com")}" value="${C.email.replace(/"/g,"")}"><button class="btn" id="cEnviar" style="width:100%">${t("Enviar código","Recevoir le code","Send code")}</button>`:
    `<p class="note" style="margin:8px 0 0">${t("Código enviado a","Code envoyé à","Code sent to")} <b>${C.email}</b>. ${t("Mira también en spam.","Regarde aussi dans les spams.","Check spam too.")}</p><input id="cCodigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"><button class="btn" id="cEntrar" style="width:100%">${t("Entrar","Entrer","Sign in")}</button><button class="lnk" id="cOtro">${t("Cambiar email o pedir otro código","Changer d'e-mail ou redemander un code","Change email or get a new code")}</button>`)+
    `<div class="msg">${C.msg}</div>`;
  const ocupa=b=>{C.ocupado=b;el.querySelectorAll("button").forEach(x=>x.disabled=b)};
  if(C.paso==="email"){
    const go=async()=>{C.email=$("#cEmail").value.trim().toLowerCase();LS.set("an_email",C.email);ocupa(true);const r=await api("codigo",{email:C.email});ocupa(false);
      if(r.ok){C.paso="codigo";C.msg=""}else C.msg=ERR[r.error]||ERR.red;pintaCuenta();if(C.paso==="codigo")$("#cCodigo").focus()};
    $("#cEnviar").onclick=go;$("#cEmail").onkeydown=e=>{if(e.key==="Enter")go()};
  }else{
    const go=async()=>{ocupa(true);const r=await api("entrar",{email:C.email,codigo:$("#cCodigo").value});ocupa(false);
      if(r.token){C.token=r.token;LS.set("an_token",r.token);delete r.token;C.st=r;C.msg="";pintaCuenta();pagoPendiente()}else{C.msg=ERR[r.error]||ERR.red;pintaCuenta()}};
    $("#cEntrar").onclick=go;$("#cCodigo").oninput=e=>{if(e.target.value.replace(/\D/g,"").length===6)go()};
    $("#cOtro").onclick=()=>{C.paso="email";C.msg="";pintaCuenta()};
  }
}
function muro(agotado=true){
  const opc=(titulo,precio,sub,url,boton,dest)=>`<div class="opc-pago${dest?" dest":""}"><b>${titulo}</b><div class="precio">${precio} <small>${sub}</small></div><a class="btn ${dest?"":"sec"}" style="display:flex;align-items:center;justify-content:center;height:52px;padding:0 8px;font-size:14px;text-decoration:none" href="${url}">${boton}</a></div>`;
  $("#muroBox").innerHTML=`<div style="font-size:34px">⭐</div><h3>${agotado?t("Has usado tus análisis","Tu as utilisé tes analyses","You've used your analyses"):t("Analiza más","Analyse plus","Analyze more")}</h3>
    <p class="note" style="margin:0">${t("Elige cómo seguir analizando tu snatch, clean y jerk:","Choisis comment continuer à analyser ton snatch, clean et jerk :","Choose how to keep analyzing your snatch, clean and jerk:")}</p>
    <div class="opcs-pago">
      ${opc(t("10 análisis","10 analyses","10 analyses"),"4,99 €",t("pago único","paiement unique","one-off"),urlPago(PAGO_PACK),t("Comprar 10","Acheter 10","Buy 10"),false)}
      ${opc(t("Ilimitado","Illimité","Unlimited"),"9,99 €",t("/ mes","/ mois","/ month"),urlPago(),t("Suscribirme","M'abonner","Subscribe"),true)}
    </div>
    <ul><li>${t("Barra y posición con IA, y vídeo para descargar","Barre et position par IA, et vidéo à télécharger","Bar and AI position, plus a video to download")}</li><li>${t("El ilimitado lo cancelas cuando quieras","L'illimité se résilie quand tu veux","Cancel unlimited anytime")}</li></ul>
    <button class="lnk" id="muroX" style="margin-top:10px">${t("Ahora no","Pas maintenant","Not now")}</button>`;
  $("#muro").classList.remove("hidden");$("#muroX").onclick=()=>$("#muro").classList.add("hidden");
}
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),4500)}
async function pagoPendiente(){
  const cs=LS.get("an_cs");if(!cs||!C.token)return;
  const r=await api("pago",{cs});
  if(r.pack){C.st=r;LS.set("an_cs",null);pintaCuenta();toast("⭐ "+t(`¡Listo! +${r.pack} análisis en tu cuenta.`,`C'est fait ! +${r.pack} analyses sur ton compte.`,`Done! +${r.pack} analyses added.`))}
  else if(r.pro){C.st=r;LS.set("an_cs",null);pintaCuenta();toast("⭐ "+t("¡Listo! Ya tienes análisis ilimitados.","C'est fait ! Tu as des analyses illimitées.","Done! You now have unlimited analyses."))}
  else if(r.error==="otra_cuenta"||r.error==="no_pagado"||r.error==="otro_producto")LS.set("an_cs",null);
}
(async()=>{
  const q=new URLSearchParams(location.search),cs=q.get("cs");
  if(cs){LS.set("an_cs",cs);history.replaceState(null,"",location.pathname)}
  if(P.pase){P.st=await progApi("estado");if(P.st&&P.st.error==="red")P.st=null;pintaProg();return} // desde Prog: sin email ni Stripe
  const cfg=await api("config");C.activo=!!cfg.activo; // hasta que el email y Stripe estén configurados, la app sigue libre
  if(!C.activo)return;
  $("#cuenta").classList.remove("hidden");
  pintaCuenta();
  if(C.token){const r=await api("estado");if(r.email){C.st=r;pintaCuenta();pagoPendiente()}else if(!C.token)pintaCuenta()}
  else if(cs)toast(t("Pago recibido. Entra con el mismo email para activarlo.","Paiement reçu. Connecte-toi avec le même e-mail pour l'activer.","Payment received. Sign in with the same email to activate it."));
})();
$("#drop").addEventListener("click",e=>{
  if(P.pase){if(P.st&&!P.st.libre&&P.st.usados>=P.st.limite){e.preventDefault();muroProg()}return}
  if(!C.activo)return;
  if(!C.st){e.preventDefault();$("#cuenta").scrollIntoView({behavior:"smooth",block:"center"});const i=$("#cEmail")||$("#cCodigo");if(i)setTimeout(()=>i.focus(),350);C.msg=C.msg||t("Primero entra con tu email.","Connecte-toi d'abord avec ton e-mail.","Sign in with your email first.");pintaCuenta();return}
  if(!C.st.pro&&C.st.usados>=C.st.limite){e.preventDefault();muro()}
},true);
/* ---------- compartir: vídeo a Instagram/WhatsApp, enlace por WhatsApp y QR ---------- */
const URLAPP="https://analizador.djimenezapps.com";
const txtComp=()=>t(`Mi ${S.nom||"levantamiento"} analizado 🏋️ Analiza el tuyo gratis: ${URLAPP}`,`Mon ${S.nom||"mouvement"} analysé 🏋️ Analyse le tien gratuitement : ${URLAPP}`,`My ${S.nom||"lift"} analyzed 🏋️ Analyze yours for free: ${URLAPP}`);
const txtApp=()=>t(`Mira esta app: analiza tu snatch, clean o jerk con IA (barra y posición) 🏋️ ${URLAPP}`,`Regarde cette appli : elle analyse ton snatch, clean ou jerk avec l'IA (barre et position) 🏋️ ${URLAPP}`,`Check this app: it analyzes your snatch, clean or jerk with AI (bar and position) 🏋️ ${URLAPP}`);
async function compartirVid(){
  const btn=$("#compVid"),nota=$("#compNota");
  if(S.dl){
    if(navigator.canShare&&navigator.canShare({files:[S.dl]})){try{await navigator.share({files:[S.dl],text:txtComp()});return}catch(e){if(e.name==="AbortError")return}}
    descargar(S.dl);nota.textContent=t("Vídeo descargado: súbelo a tu historia o mándalo desde la galería.","Vidéo téléchargée : publie-la en story ou envoie-la depuis ta galerie.","Video downloaded: post it to your story or send it from your gallery.");return;
  }
  if(S.pts.length<4||S.grabando||!S.listo)return;
  rpStop();const PREP=t("Preparando el vídeo…","Préparation de la vidéo…","Preparing the video…");
  S.grabando=true;btn.disabled=true;btn.textContent=PREP;nota.textContent=PREP+" 0 %";
  const dn=$("#dlnota"),obs=new MutationObserver(()=>{nota.textContent=dn.textContent});obs.observe(dn,{childList:true,characterData:true,subtree:true});
  try{S.dl=await exportar();btn.textContent=t("📤 Publicar ahora","📤 Publier maintenant","📤 Post now");
    nota.textContent=t("Listo. Toca otra vez y elige Instagram o WhatsApp.","Prête. Touche à nouveau et choisis Instagram ou WhatsApp.","Ready. Tap again and pick Instagram or WhatsApp.")}
  catch(err){btn.textContent=I.compVid[LI];nota.textContent=t("No se ha podido crear el vídeo en este navegador.","Impossible de créer la vidéo dans ce navigateur.","The video couldn't be created in this browser.")}
  obs.disconnect();btn.disabled=false;S.grabando=false;
}
$("#compVid").onclick=compartirVid;
const abrirWa=txt=>{window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank")};
$("#compWa").onclick=()=>abrirWa(txtComp());
$("#appWa").onclick=()=>abrirWa(txtApp());
const abrirQr=()=>$("#qrM").classList.remove("hidden");
$("#compQr").onclick=abrirQr;$("#appQr").onclick=abrirQr;
$("#qrX").onclick=()=>$("#qrM").classList.add("hidden");
$("#qrM").onclick=e=>{if(e.target.id==="qrM")$("#qrM").classList.add("hidden")};
paso();
