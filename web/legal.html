const q = new URLSearchParams(location.search);
let lang = q.get("lang") || (localStorage.getItem("dj_lang") || "").replace(/"/g, "") || ((navigator.languages || [navigator.language]).some((l) => /^fr/i.test(l)) ? "fr" : "es");
function pinta() {
  const T = TXT[lang] || TXT.fr;
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((e) => { e.textContent = T[e.dataset.t]; });
  document.querySelectorAll("[data-lang]").forEach((b) => b.classList.toggle("on", b.dataset.lang === lang));
  document.getElementById("m").innerHTML = T.html();
  if (location.hash) { const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }
}
document.querySelectorAll("[data-lang]").forEach((b) => b.onclick = () => { lang = b.dataset.lang; pinta(); });
